# Draait bij elke push en pull request: lint, tests, bouwen, clippy en cargo test (hetzelfde als `npm run check`).
name: Controle

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Systeemonderdelen
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf cmake build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: |
          npm ci
          npm --prefix mcp-server ci
      - run: npm run check
