[package]
name = "studio"
version = "0.1.0"
description = "Studio: lokale app-bouwer voor AI-CLI's"
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
portable-pty = "0.9"
base64 = "0.22"
getrandom = "0.3"
notify = "8"
dunce = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ignore = "0.4"
ureq = "3"
sqlparser = { version = "0.64.0", features = ["visitor"] }
keyring = "4.2.0"
sha2 = "0.10"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
