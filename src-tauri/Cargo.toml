[package]
name = "studio"
version = "0.1.0"
description = "Studio: lokale app-bouwer voor AI-CLI's"
edition = "2021"

[lib]
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
portable-pty = "0.9"
base64 = "0.22"
getrandom = "0.3"
notify = "8"
dunce = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ignore = "0.4"
ureq = "3"
sqlparser = { version = "0.64.0", features = ["visitor"] }
keyring = "4.2.0"
sha2 = "0.10"
minisign-verify = "0.3"
tauri-plugin-opener = "2"
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }
regex = "1"
sha1 = "0.10"
tauri-plugin-updater = "2"
unicode-segmentation = "1"
fs4 = "0.13"

# OpenSSL wordt alleen door git2 binnengehaald (de `https`-feature). libgit2 heeft geen rustls-variant: Windows gebruikt WinHTTP,
# macOS gebruikt SecureTransport en alleen Linux gebruikt echt OpenSSL. Maar de Rust-crate `openssl-sys` wordt voor alle unix-doelen
# (dus ook macOS) gecompileerd, en dat faalt bij cross-compileren (Intel-bouw op een Apple Silicon-runner: geen pkg-config naar een
# x86_64-OpenSSL). Daarom op macOS (alleen daar) OpenSSL uit de bron meebouwen; Linux gebruikt de systeem-OpenSSL, Windows heeft geen OpenSSL.
[target.'cfg(target_os = "macos")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[dev-dependencies]
tempfile = "3"
